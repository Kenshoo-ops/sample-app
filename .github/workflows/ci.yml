name: ci

on:
  push:
    branches:
      - main
      - "feat/**"
      - "chore/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: Kenshoo-ops/kenshoo-workflows/.github/workflows/secure-build.yml@main
    with:
      image: ghcr.io/kenshoo-ops/sample-app
